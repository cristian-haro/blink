# Flow de prueba E2E: Creación de Secreto Protegido con Contraseña
# Valida la generación de secretos con clave de cifrado adicional (PBKDF2)

url: ${APP_URL}
---
# 1. Cargar aplicación
- assertVisible: ".*Blink.*"

# 2. Introducir mensaje confidencial
- tapOn: "Escribe el contenido de tu mensaje..."
- inputText: "Contenido protegido con contraseña secreta"

# 3. Introducir contraseña en el campo opcional
- tapOn: "Protege el enlace con una contraseña (opcional)"
- inputText: "SuperClave123!"

# 4. Generar enlace seguro
- tapOn: "Generar Enlace Seguro"

# 5. Comprobar que el enlace generado se muestra correctamente
- assertVisible: "🔗 ¡Enlace Listo!"
- assertVisible: "Comparte este enlace con el destinatario."

# 6. Cerrar modal
- tapOn:
    id: "closeModalBtn"
- assertNotVisible: "🔗 ¡Enlace Listo!"
