# Flow de prueba E2E: Creación de Secreto Seguro y Modal de Enlace
# Valida el flujo principal de usuario: escribir mensaje, configurar opciones y generar enlace

url: ${APP_URL}
---
# 1. Verificar carga inicial de la aplicación
- assertVisible: ".*Blink.*"
- assertVisible: "Mensaje"

# 2. Rellenar mensaje y configurar parámetros
- tapOn: "Escribe el contenido de tu mensaje..."
- inputText: "Mensaje ultrasecreto de prueba automatizada"

- tapOn:
    id: "ttl"
- tapOn: "24 Horas"

- tapOn:
    id: "maxUses"
- eraseText: 1
- inputText: "3"

# 3. Generar enlace seguro
- tapOn: "Generar Enlace Seguro"

# 4. Validar que se muestre el modal con el enlace y opciones de compartir
- assertVisible: "🔗 ¡Enlace Listo!"
- assertVisible: "Comparte este enlace con el destinatario."
- assertVisible: "📋 Copiar Enlace"
- assertVisible: "📧 Enviar por Correo"

# 5. Copiar enlace e interactuar con el modal
- tapOn: "📋 Copiar Enlace"
- assertVisible: ".*copiado.*"

# 6. Cerrar modal y comprobar retorno al formulario
- tapOn:
    id: "closeModalBtn"
- assertNotVisible: "🔗 ¡Enlace Listo!"
