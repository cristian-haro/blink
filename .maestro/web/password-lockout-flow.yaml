# Flow de prueba E2E: Bloqueo de Intentos de Contraseña
# Valida el flujo de seguridad para secretos protegidos por contraseña

url: ${APP_URL}
---
# 1. Cargar aplicación y escribir mensaje
- assertVisible: ".*Blink.*"
- tapOn: "Escribe el contenido de tu mensaje..."
- inputText: "Mensaje a proteger con bloqueo de intentos"

# 2. Configurar contraseña
- tapOn: "Protege el enlace con una contraseña (opcional)"
- inputText: "ClaveCorrecta99"

# 3. Generar enlace y verificar modal
- tapOn: "Generar Enlace Seguro"
- assertVisible: "🔗 ¡Enlace Listo!"

# 4. Copiar enlace y cerrar modal
- tapOn: "📋 Copiar Enlace"
- assertVisible: ".*copiado.*"
- tapOn:
    id: "closeModalBtn"
- assertNotVisible: "🔗 ¡Enlace Listo!"
