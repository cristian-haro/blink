version: '3.8'

services:
  # Servicio de Base de Datos
  redis:
    image: redis:alpine
    container_name: redis-service
    restart: always
    ports:
      - "6379:6379"

  # Servicio de tu Aplicación
  blink-app:
    build: .
    container_name: blink-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis