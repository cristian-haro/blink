version: '3.8'

services:
  blink-app:
    build: .
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - REDIS_URL=redis://redis-service:6379
      - PORT=3000
      - MAX_BODY_SIZE=${MAX_BODY_SIZE:-50mb}
    depends_on:
      - redis-service
    networks:
      - blink_net
    # Production: Run as non-root user (Node image usually has 'node' user)
    # user: node 

  redis-service:
    image: "redis:alpine"
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - blink_net

networks:
  blink_net:
    driver: bridge

volumes:
  redis_data:
